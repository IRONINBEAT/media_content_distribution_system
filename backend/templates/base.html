<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: none;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
        }

        .brand-icon {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            filter: brightness(0) invert(1);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/web/dashboard">
                <img src="/static/favicon.png" alt="Иконка" class="brand-icon">
                <span class="d-none d-sm-inline">Система распространения медиаконтента</span>
                <span class="d-inline d-sm-none">СРМ</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto align-items-lg-center">
                    {% if user %}
                    <span class="navbar-text me-lg-3 custom-nav-user">
                        {{ user.full_name }}
                        <span class="user-role-label">({{ user.role }})</span>
                    </span>

                    {% if user.role == 'admin' %}
                    <a href="/web/admin/users" class="btn btn-outline-info btn-sm custom-nav-btn me-lg-2">
                        👥 Пользователи
                    </a>
                    {% endif %}

                    <a href="/web/logout" class="btn btn-outline-danger btn-sm custom-nav-btn">
                        Выход
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <style>
        .custom-nav-user {
            color: rgba(255, 255, 255, 0.55) !important;
            font-weight: normal;
        }

        @media (max-width: 992px) {
            .navbar-nav {
                padding: 1rem 0;
            }

            .custom-nav-user {
                display: block;
                text-align: center;
                padding-bottom: 10px;
                margin-bottom: 15px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                color: #fff !important;
            }

            .custom-nav-btn {
                display: block;
                width: 100%;
                padding: 12px !important;
                font-size: 1.1rem !important;
                margin-bottom: 10px;
            }
        }
    </style>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function copyToClipboard(elementId, buttonElement) {
            const text = document.getElementById(elementId).innerText;

            navigator.clipboard.writeText(text).then(() => {
                const originalHtml = buttonElement.innerHTML;

                buttonElement.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#198754" class="bi bi-check-lg" viewBox="0 0 16 16">
                <path d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425z"/>
            </svg>`;

                setTimeout(() => {
                    buttonElement.innerHTML = originalHtml;
                }, 2000);
            });
        }
    </script>
</body>

</html>
